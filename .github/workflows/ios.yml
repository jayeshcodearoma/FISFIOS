name: iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install

      - run: |
          cd ios
          pod install

      - run: |
          xcodebuild \
            -workspace ios/FISFIOS.xcworkspace \
            -scheme FISFIOS \
            -sdk iphonesimulator \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ~/Library/Developer/Xcode/DerivedData